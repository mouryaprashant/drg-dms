<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Section & Station Directory</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased p-2 sm:p-4">

    <!-- Sync Toast Status -->
    <div id="syncToast" class="fixed bottom-4 right-4 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transition-opacity opacity-0 pointer-events-none">
        <span id="syncToastText">Syncing...</span>
    </div>

    <!-- Main Outer Container -->
    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- Header & Top Control Bar -->
        <div class="bg-blue-900 text-white p-4 sm:p-6 rounded-xl shadow-md">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide flex items-center gap-2">
                        <svg class="w-7 h-7 text-blue-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8m0 0V4a2 2 0 00-2-2H8a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7.5L12 13z"></path>
                        </svg>
                        Railway Section & Station Directory
                    </h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="syncBadge" class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded bg-blue-800 text-blue-200">
                            ● Initializing...
                        </span>
                        <span id="modeBadge" class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                            👁️ Public View Mode
                        </span>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex flex-wrap gap-2 items-center">
                    <button type="button" onclick="fetchDataFromSupabase(true)" class="bg-blue-800 hover:bg-blue-700 text-blue-100 px-3 py-2 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1">
                        <svg id="syncIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Refresh
                    </button>
                    <button type="button" onclick="toggleAllSections(true)" class="bg-blue-800 hover:bg-blue-700 text-blue-100 px-3 py-2 rounded-lg text-xs font-semibold transition-colors">
                        Expand All
                    </button>
                    <button type="button" onclick="toggleAllSections(false)" class="bg-blue-800 hover:bg-blue-700 text-blue-100 px-3 py-2 rounded-lg text-xs font-semibold transition-colors">
                        Collapse All
                    </button>

                    <!-- Admin Only Buttons -->
                    <div id="adminActionButtons" class="hidden flex flex-wrap gap-2">
                        <button type="button" onclick="openSectionModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow transition-colors flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                            Add Section
                        </button>
                        <button type="button" onclick="openStationModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow transition-colors flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                            Add Station
                        </button>
                    </div>

                    <!-- Admin Auth Lock Toggle Button -->
                    <button type="button" id="adminAuthBtn" onclick="handleAdminAuthToggle()" class="bg-amber-600 hover:bg-amber-500 text-white px-3.5 py-2 rounded-lg text-xs font-bold shadow transition-colors flex items-center gap-1.5 ml-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <span id="adminAuthBtnText">Admin Login</span>
                    </button>
                </div>
            </div>

            <!-- Search Bar & Stats -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-3 border-t border-blue-800">
                <div class="relative w-full sm:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="searchInput" onkeyup="renderSections()" placeholder="Search station name, code, or document..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white text-slate-800">
                </div>
                <span id="overallStats" class="text-xs text-blue-200 font-medium">Ready</span>
            </div>
        </div>

        <!-- Section Navigation Filter Pills Bar -->
        <div class="bg-white p-2.5 rounded-xl shadow-sm border border-slate-200 overflow-x-auto custom-scrollbar flex items-center gap-2" id="sectionPillsBar"></div>

        <!-- Connection / Loading Status Bar -->
        <div id="loadingIndicator" class="bg-amber-50 border border-amber-200 text-amber-900 px-4 py-3 rounded-xl text-xs flex justify-between items-center font-medium">
            <span id="loadingText">Connecting to database...</span>
            <button onclick="fetchDataFromSupabase(true)" class="underline font-bold hover:text-amber-950">Retry Connection</button>
        </div>

        <!-- Sections Collapsible Container -->
        <div id="sectionsContainer" class="space-y-4"></div>

    </div>

    <!-- ================= MODAL: ADMIN LOGIN ================= -->
    <div id="adminAuthModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 relative">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900">Admin Login</h3>
                <button type="button" onclick="closeModal('adminAuthModal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form onsubmit="handleAdminLoginSubmit(event)" class="mt-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Enter Admin PIN / Password</label>
                    <input type="password" id="adminPinInput" required placeholder="e.g. 1234" class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <p id="adminPinError" class="text-xs text-rose-600 font-medium mt-1 hidden">Incorrect PIN!</p>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('adminAuthModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 border border-slate-300 rounded-md hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-amber-600 rounded-md hover:bg-amber-700 shadow-sm">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: CONFIRMATION ================= -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 relative">
            <h3 class="text-base font-bold text-slate-900 mb-1" id="confirmModalTitle">Confirm Action</h3>
            <p class="text-xs text-slate-600 mb-4" id="confirmModalMessage">Are you sure you want to proceed?</p>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal('confirmModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 border border-slate-300 rounded-md hover:bg-slate-50">Cancel</button>
                <button type="button" id="confirmModalActionBtn" class="px-4 py-2 text-xs font-semibold text-white bg-rose-600 rounded-md hover:bg-rose-700 shadow-sm">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ================= MODAL: ALL DOCUMENTS VIEWER ================= -->
    <div id="docViewerModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-lg p-6 relative max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-slate-200">
                <div>
                    <h3 id="docViewerStationName" class="text-lg font-bold text-slate-900">Station Documents</h3>
                    <p id="docViewerStationCode" class="text-xs text-slate-500 font-mono"></p>
                </div>
                <button type="button" onclick="closeModal('docViewerModal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div id="docViewerList" class="my-4 overflow-y-auto space-y-2 pr-1 custom-scrollbar flex-1"></div>

            <div class="flex justify-end pt-3 border-t border-slate-100">
                <button type="button" onclick="closeModal('docViewerModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 border border-slate-300 rounded-md hover:bg-slate-50">Close</button>
            </div>
        </div>
    </div>

    <!-- ================= MODAL: ADD / EDIT SECTION ================= -->
    <div id="sectionModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md p-6 relative">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 id="sectionModalTitle" class="text-lg font-bold text-slate-900">Add New Section</h3>
                <button type="button" onclick="closeModal('sectionModal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <form onsubmit="handleSaveSection(event)" class="mt-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Section Name *</label>
                    <input type="text" id="sectionNameInput" required placeholder="e.g. KTE-BINA Section" class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal('sectionModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 border border-slate-300 rounded-md hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-emerald-600 rounded-md hover:bg-emerald-700 shadow-sm">Save Section</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: ADD / EDIT STATION ================= -->
    <div id="stationModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-2xl p-6 relative max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 id="stationModalTitle" class="text-lg font-bold text-slate-900">Add New Station</h3>
                <button type="button" onclick="closeModal('stationModal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <form id="stationForm" onsubmit="handleSaveStation(event)" class="mt-4 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Assigned Section *</label>
                        <select id="stationSectionSelect" onchange="updatePositionOptions()" required class="w-full px-3 py-1.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Geographical Position *</label>
                        <select id="stationPositionSelect" class="w-full px-3 py-1.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"></select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Station Code *</label>
                        <input type="text" id="stationCodeInput" required placeholder="e.g. SGO" class="w-full px-3 py-1.5 border border-slate-300 rounded-md text-sm uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Station Name *</label>
                        <input type="text" id="stationNameInput" required placeholder="e.g. Saugor" class="w-full px-3 py-1.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Zone / Division</label>
                        <input type="text" id="stationZoneInput" placeholder="e.g. West Central Railway" class="w-full px-3 py-1.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-200">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-xs font-bold text-slate-700 uppercase tracking-wide">Station Documents (Google Drive Links)</p>
                        <button type="button" onclick="addDocumentRow()" class="text-xs font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-md border border-blue-200 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                            Add Another Document
                        </button>
                    </div>
                    <div id="docsInputsContainer" class="space-y-2"></div>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal('stationModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 border border-slate-300 rounded-md hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 shadow-sm">Save Station</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ENGINE ================= -->
    <script>
        // ⚠️ 1. SUPABASE CREDENTIALS (REPLACE WITH YOUR ACTUAL CREDENTIALS)
        const SUPABASE_URL = "https://hwwqansudpzdqwtkmuyz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3d3FhbnN1ZHB6ZHF3dGttdXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjYxNzIsImV4cCI6MjEwNTA0MjE3Mn0.beNuL7zOwcNmD3WRTwgv0bZZrirTQ4Q42KQHyYYw4Qc";

        // 🔑 2. SET YOUR ADMIN PIN / PASSWORD HERE
        const ADMIN_PIN = "1234";

        let supabaseClient = null;
        let activeSectionFilter = 'ALL';
        const MAX_INLINE_DOCS = 3;
        let sectionsData = [];
        let currentEditingStationId = null;
        let currentEditingSectionId = null;
        let pendingConfirmCallback = null;

        // Admin State Management
        let isAdmin = localStorage.getItem('railway_directory_admin') === 'true';

        function updateAdminUI() {
            const adminButtons = document.getElementById('adminActionButtons');
            const authBtnText = document.getElementById('adminAuthBtnText');
            const modeBadge = document.getElementById('modeBadge');
            const authBtn = document.getElementById('adminAuthBtn');

            if (isAdmin) {
                adminButtons.classList.remove('hidden');
                authBtnText.innerText = "Exit Admin";
                authBtn.className = "bg-rose-700 hover:bg-rose-600 text-white px-3.5 py-2 rounded-lg text-xs font-bold shadow transition-colors flex items-center gap-1.5 ml-1";
                modeBadge.innerText = "⚡ Admin Mode Active";
                modeBadge.className = "inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded bg-amber-500 text-slate-950";
            } else {
                adminButtons.classList.add('hidden');
                authBtnText.innerText = "Admin Login";
                authBtn.className = "bg-amber-600 hover:bg-amber-500 text-white px-3.5 py-2 rounded-lg text-xs font-bold shadow transition-colors flex items-center gap-1.5 ml-1";
                modeBadge.innerText = "👁️ Public View Mode";
                modeBadge.className = "inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300";
            }
            renderSections();
        }

        function handleAdminAuthToggle() {
            if (isAdmin) {
                isAdmin = false;
                localStorage.setItem('railway_directory_admin', 'false');
                showToast("Logged out of Admin mode");
                updateAdminUI();
            } else {
                document.getElementById('adminPinInput').value = '';
                document.getElementById('adminPinError').classList.add('hidden');
                document.getElementById('adminAuthModal').classList.remove('hidden');
                setTimeout(() => document.getElementById('adminPinInput').focus(), 100);
            }
        }

        function handleAdminLoginSubmit(e) {
            e.preventDefault();
            const inputPin = document.getElementById('adminPinInput').value;
            if (inputPin === ADMIN_PIN) {
                isAdmin = true;
                localStorage.setItem('railway_directory_admin', 'true');
                closeModal('adminAuthModal');
                showToast("✓ Admin Mode Unlocked!");
                updateAdminUI();
            } else {
                document.getElementById('adminPinError').classList.remove('hidden');
            }
        }

        function showConfirmModal(title, message, onConfirm) {
            document.getElementById('confirmModalTitle').innerText = title;
            document.getElementById('confirmModalMessage').innerText = message;
            pendingConfirmCallback = onConfirm;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        document.getElementById('confirmModalActionBtn').onclick = function() {
            if (pendingConfirmCallback) {
                pendingConfirmCallback();
                pendingConfirmCallback = null;
            }
            closeModal('confirmModal');
        };

        function initSupabaseClient() {
            if (!window.supabase) return false;
            if (!SUPABASE_URL || SUPABASE_URL.includes("YOUR-PROJECT-ID") || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_ANON_KEY")) return false;
            try {
                let formattedUrl = SUPABASE_URL.trim();
                if (!formattedUrl.startsWith("http://") && !formattedUrl.startsWith("https://")) {
                    formattedUrl = "https://" + formattedUrl;
                }
                supabaseClient = window.supabase.createClient(formattedUrl, SUPABASE_ANON_KEY.trim());
                return true;
            } catch (err) {
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSupabaseClient();
            updateAdminUI();
            fetchDataFromSupabase();
        });

        function updateBadge(text, colorClass) {
            const badge = document.getElementById('syncBadge');
            if (badge) {
                badge.innerText = text;
                badge.className = `inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded ${colorClass}`;
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('syncToast');
            const text = document.getElementById('syncToastText');
            if (!toast || !text) return;
            text.innerText = message;
            toast.className = `fixed bottom-4 right-4 z-50 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transition-opacity opacity-100 ${isError ? 'bg-red-700' : 'bg-slate-900'}`;
            setTimeout(() => { toast.classList.add('opacity-0'); }, 3500);
        }

        // FETCH DATA FROM SUPABASE DATABASE
        async function fetchDataFromSupabase(isManual = false) {
            if (!supabaseClient && !initSupabaseClient()) {
                document.getElementById('loadingIndicator').classList.remove('hidden');
                document.getElementById('loadingText').innerHTML = "⚠️ <b>Supabase Setup Required:</b> Insert your real <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> in the JavaScript code.";
                updateBadge("✕ Credentials Needed", "bg-rose-800 text-rose-200");
                renderSections();
                return;
            }

            const syncIcon = document.getElementById('syncIcon');
            if (syncIcon) syncIcon.classList.add('animate-spin');
            updateBadge("● Querying DB...", "bg-blue-800 text-blue-200");

            try {
                const { data, error } = await supabaseClient
                    .from('sections')
                    .select('*, stations(*)')
                    .order('created_at', { ascending: true });

                if (error) throw error;

                if (syncIcon) syncIcon.classList.remove('animate-spin');
                document.getElementById('loadingIndicator').classList.add('hidden');

                const collapseStateMap = {};
                sectionsData.forEach(s => collapseStateMap[s.id] = s.collapsed);

                sectionsData = (data || []).map(sec => ({
                    id: sec.id,
                    name: sec.name,
                    collapsed: collapseStateMap[sec.id] !== undefined ? collapseStateMap[sec.id] : false,
                    stations: (sec.stations || [])
                        .sort((a, b) => (a.display_order || 0) - (b.display_order || 0))
                        .map(st => ({
                            id: st.id,
                            name: st.name,
                            code: st.code,
                            zone: st.zone,
                            docs: st.docs || [],
                            display_order: st.display_order || 0
                        }))
                }));

                renderSections();

        // SAVE / EDIT SECTION
        async function handleSaveSection(e) {
            e.preventDefault();
            if (!isAdmin) return;
            const name = document.getElementById('sectionNameInput').value.trim();
            if(!name) return;

            updateBadge("● Saving...", "bg-blue-800 text-blue-200");

            try {
                if (currentEditingSectionId) {
                    const { error } = await supabaseClient
                        .from('sections')
                        .update({ name })
                        .eq('id', currentEditingSectionId);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient
                        .from('sections')
                        .insert([{ name }]);
                    if (error) throw error;
                }

                closeModal('sectionModal');
                await fetchDataFromSupabase();
                showToast("✓ Section saved!");

            } catch (err) {
                showToast("Failed to save section: " + err.message, true);
            }
        }

        // DELETE SECTION
        function deleteSection(secId) {
            if (!isAdmin) return;
            const sec = sectionsData.find(s => s.id === secId);
            if(!sec || !supabaseClient) return;

            const msg = sec.stations.length > 0 
                ? `Delete section "${sec.name}" and all ${sec.stations.length} station(s) inside it?`
                : `Delete section "${sec.name}"?`;

            showConfirmModal("Delete Section", msg, async () => {
                try {
                    const { error } = await supabaseClient.from('sections').delete().eq('id', secId);
                    if (error) throw error;

                    if(activeSectionFilter === secId) activeSectionFilter = 'ALL';
                    await fetchDataFromSupabase();
                    showToast("✓ Section deleted!");
                } catch(err) {
                    showToast("Failed to delete section", true);
                }
            });
        }

        // SAVE / EDIT STATION
        async function handleSaveStation(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const secId = document.getElementById('stationSectionSelect').value;
            const posValue = document.getElementById('stationPositionSelect').value;
            const name = document.getElementById('stationNameInput').value.trim();
            const code = document.getElementById('stationCodeInput').value.trim();
            const zone = document.getElementById('stationZoneInput').value.trim();

            const docRows = document.querySelectorAll('#docsInputsContainer .doc-input-row');
            const docs = [];
            docRows.forEach(row => {
                const label = row.querySelector('.doc-label-input').value.trim();
                const url = row.querySelector('.doc-url-input').value.trim();
                if(label || url) {
                    docs.push({ label: label || 'Document', url: url });
                }
            });

            try {
                const targetSec = sectionsData.find(s => s.id === secId);
                let order = 0;

                if (posValue === 'START') {
                    order = 0;
                } else if (posValue.startsWith('AFTER_')) {
                    const afterId = posValue.replace('AFTER_', '');
                    const afterIdx = targetSec ? targetSec.stations.findIndex(st => st.id === afterId) : -1;
                    order = afterIdx !== -1 ? (targetSec.stations[afterIdx].display_order || 0) + 1 : 999;
                } else {
                    order = targetSec && targetSec.stations.length > 0 ? (Math.max(...targetSec.stations.map(s => s.display_order || 0)) + 1) : 0;
                }

                if (currentEditingStationId) {
                    const { error } = await supabaseClient
                        .from('stations')
                        .update({ section_id: secId, name, code, zone, docs, display_order: order })
                        .eq('id', currentEditingStationId);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient
                        .from('stations')
                        .insert([{ section_id: secId, name, code, zone, docs, display_order: order }]);
                    if (error) throw error;
                }

                closeModal('stationModal');
                await fetchDataFromSupabase();
                showToast("✓ Station saved!");

            } catch (err) {
                showToast("Failed to save station: " + err.message, true);
            }
        }

        // DELETE STATION
        function deleteStation(secId, stId) {
            if (!isAdmin) return;
            const sec = sectionsData.find(s => s.id === secId);
            if(!sec) return;
            const st = sec.stations.find(x => x.id === stId);
            if(!st || !supabaseClient) return;

            showConfirmModal("Delete Station", `Delete station "${st.name}" (${st.code})?`, async () => {
                try {
                    const { error } = await supabaseClient.from('stations').delete().eq('id', stId);
                    if (error) throw error;

                    await fetchDataFromSupabase();
                    showToast("✓ Station deleted!");
                } catch(err) {
                    showToast("Failed to delete station", true);
                }
            });
        }

        // MOVE STATION ORDER (UP / DOWN)
        async function moveStation(secId, stId, direction) {
            if (!isAdmin) return;
            const sec = sectionsData.find(s => s.id === secId);
            if(!sec || !supabaseClient) return;

            const idx = sec.stations.findIndex(st => st.id === stId);
            if(idx === -1) return;

            let targetIdx = direction === 'up' ? idx - 1 : idx + 1;
            if(targetIdx < 0 || targetIdx >= sec.stations.length) return;

            const currentSt = sec.stations[idx];
            const targetSt = sec.stations[targetIdx];

            const currentOrder = currentSt.display_order || idx;
            const targetOrder = targetSt.display_order || targetIdx;

            try {
                await Promise.all([
                    supabaseClient.from('stations').update({ display_order: targetOrder }).eq('id', currentSt.id),
                    supabaseClient.from('stations').update({ display_order: currentOrder }).eq('id', targetSt.id)
                ]);

                await fetchDataFromSupabase();
            } catch(err) {
                showToast("Failed to update position", true);
            }
        }

        function getBadgeStyle(label) {
            const palette = [
                'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100',
                'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100',
                'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100',
                'bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100',
                'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100',
                'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100',
                'bg-cyan-50 text-cyan-700 border-cyan-200 hover:bg-cyan-100'
            ];
            const cleanStr = (label || '').trim().toLowerCase();
            let hash = 0;
            for (let i = 0; i < cleanStr.length; i++) hash = cleanStr.charCodeAt(i) + ((hash << 5) - hash);
            return palette[Math.abs(hash) % palette.length];
        }

        function openStationModal(targetSecId = null, targetStId = null) {
            if (!isAdmin) return;
            currentEditingSectionId = targetSecId;
            currentEditingStationId = targetStId;

            const select = document.getElementById('stationSectionSelect');
            
            if (sectionsData.length === 0) {
                showToast("Please add at least one Section before adding stations!", true);
                openSectionModal();
                return;
            }

            select.innerHTML = sectionsData.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

            const docsContainer = document.getElementById('docsInputsContainer');
            docsContainer.innerHTML = '';

            if(targetStId) {
                document.getElementById('stationModalTitle').innerText = 'Edit Station Details';
                let foundSt = null;
                let foundSec = null;
                sectionsData.forEach(s => {
                    const st = s.stations.find(x => x.id === targetStId);
                    if(st) { foundSt = st; foundSec = s; }
                });

                if(foundSt) {
                    select.value = foundSec.id;
                    updatePositionOptions();
                    
                    document.getElementById('stationNameInput').value = foundSt.name;
                    document.getElementById('stationCodeInput').value = foundSt.code;
                    document.getElementById('stationZoneInput').value = foundSt.zone || '';

                    if(foundSt.docs && foundSt.docs.length > 0) {
                        foundSt.docs.forEach(d => addDocumentRow(d.label, d.url));
                    } else {
                        addDefaultDocRows();
                    }
                }
            } else {
                document.getElementById('stationModalTitle').innerText = 'Add New Station';
                document.getElementById('stationForm').reset();
                if(targetSecId) select.value = targetSecId;
                updatePositionOptions();
                addDefaultDocRows();
            }

            document.getElementById('stationModal').classList.remove('hidden');
        }

        function addDefaultDocRows() {
            addDocumentRow('SIP', '');
            addDocumentRow('ESP', '');
            addDocumentRow('RSP', '');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
</body>
</html>
